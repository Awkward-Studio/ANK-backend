name: Build, Push, and Deploy to ECS

on:
  push:
    branches: ["main"]

concurrency:
  group: ecs-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }} # e.g. ap-south-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # e.g. 9124....dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO_NAME: ${{ vars.ECR_REPO_NAME }} # e.g. ank-prod-backend
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }} # e.g. ank-prod-cluster
  ECS_SERVICE: ${{ vars.ECS_SERVICE }} # e.g. ank-prod-svc
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }} # e.g. ank-prod-taskdef
  ECS_CONTAINER_NAME: web # the container name in the task def
  TASKDEF_PATH: infra/taskdef.json # committed taskdef (see note below)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # IAM role with ECR/ECS perms
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (immutable tag + latest)
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_SHA}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPO_NAME}:latest"

          docker build -t "${IMAGE_URI}" .
          docker tag "${IMAGE_URI}" "${LATEST_URI}"

          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      # Renders a new task definition JSON from the one committed in your repo,
      # swapping in the freshly built image for the specific container.
      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASKDEF_PATH }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Configure shared Google Calendar
        id: calendar
        env:
          TASK_DEFINITION: ${{ steps.render.outputs.task-definition }}
          CALENDAR_SECRET_ARN: ${{ vars.GOOGLE_CALENDAR_OAUTH_SECRET_ARN }}
          CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          CALENDAR_ACCOUNT: ${{ vars.GOOGLE_CALENDAR_ACCOUNT_EMAIL }}
          CALENDAR_APP_ORIGIN: ${{ vars.GOOGLE_CALENDAR_APP_ORIGIN }}
          GOOGLE_LOGIN_DOMAIN: ${{ vars.GOOGLE_LOGIN_DOMAIN }}
        run: |
          set -euo pipefail
          if [[ -z "$CALENDAR_ID" && -z "$GOOGLE_LOGIN_DOMAIN" ]]; then
            echo "task-definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ( -n "$CALENDAR_ID" && -z "$CALENDAR_ACCOUNT" ) || ! "$CALENDAR_APP_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::Set GOOGLE_CALENDAR_APP_ORIGIN and, when enabling Calendar, GOOGLE_CALENDAR_ACCOUNT_EMAIL."
            exit 1
          fi
          calendar_task="$RUNNER_TEMP/ank-calendar-task-definition.json"
          jq --arg container "$ECS_CONTAINER_NAME" \
            --arg arn "$CALENDAR_SECRET_ARN" \
            --arg id "$CALENDAR_ID" \
            --arg account "$CALENDAR_ACCOUNT" \
            --arg loginDomain "$GOOGLE_LOGIN_DOMAIN" \
            --arg origin "$CALENDAR_APP_ORIGIN" '
              (.containerDefinitions[] | select(.name == $container)) |= (
                .environment += [
                  {name: "GOOGLE_CALENDAR_ID", value: $id},
                  {name: "GOOGLE_CALENDAR_ACCOUNT_EMAIL", value: $account},
                  {name: "GOOGLE_CALENDAR_APP_ORIGIN", value: $origin},
                  {name: "GOOGLE_LOGIN_DOMAIN", value: $loginDomain}
                ]
                | if $arn != "" then
                    .secrets |= (map(select(
                      .name != "GOOGLE_CALENDAR_CLIENT_ID" and .name != "GOOGLE_CALENDAR_CLIENT_SECRET"
                    )) + [
                  {name: "GOOGLE_CALENDAR_CLIENT_ID", valueFrom: ($arn + ":GOOGLE_CALENDAR_CLIENT_ID::")},
                  {name: "GOOGLE_CALENDAR_CLIENT_SECRET", valueFrom: ($arn + ":GOOGLE_CALENDAR_CLIENT_SECRET::")}
                    ])
                  else .
                  end
              )
            ' "$TASK_DEFINITION" > "$calendar_task"
          echo "task-definition=$calendar_task" >> "$GITHUB_OUTPUT"

      # Registers the new revision and updates the service. Waits for stability.
      - name: Deploy to Amazon ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.calendar.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: false

      # If something goes sideways, dump recent service events to the logs.
      - name: Dump recent ECS service events on failure
        if: failure()
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].events[0:15].[createdAt,message]' \
            --output table
